{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notify-service-policy
spec:
  podSelector:
    matchLabels:
      app: notify-service
  policyTypes:
    - Ingress
  ingress:
    # Rule: ONLY allow incoming traffic from core-api on port 8001
    - from:
        - podSelector:
            matchLabels:
              app: core-api
      ports:
        - protocol: TCP
          port: 8001
{{- end }}