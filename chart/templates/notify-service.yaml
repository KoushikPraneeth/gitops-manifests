{{- if .Values.notifyService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notify-service
  labels:
    app: notify-service
spec:
  replicas: {{ .Values.notifyService.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: notify-service
  template:
    metadata:
      labels:
        app: notify-service
    spec:
      containers:
        - name: notify-service
          image: "{{ .Values.notifyService.image.repository }}:{{ .Values.notifyService.image.tag }}"
          imagePullPolicy: {{ .Values.notifyService.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.notifyService.service.port }}
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.notifyService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: notify-service
  labels:
    app: notify-service
spec:
  type: {{ .Values.notifyService.service.type }}
  ports:
    - port: {{ .Values.notifyService.service.port }}
      targetPort: 8001
      name: http
  selector:
    app: notify-service
{{- end }}